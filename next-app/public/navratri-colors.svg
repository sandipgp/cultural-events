<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Garba Nights">
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e1145"/>
      <stop offset="0.5" stop-color="#c0143c"/>
      <stop offset="1" stop-color="#f6a01e"/>
    </linearGradient>
    <radialGradient id="nc-glow" cx="50%" cy="24%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="dancer2">
      <path d="M-9 -62 L9 -62 L11 0 L-11 0 Z" fill="#fff2e0"/>
      <path d="M-11 0 L-50 86 L50 86 L11 0 Z" fill="#fff2e0"/>
      <circle cx="0" cy="-80" r="15" fill="#fff2e0"/>
      <path d="M-7 -58 L-44 -84" stroke="#fff2e0" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M7 -58 L44 -84" stroke="#fff2e0" stroke-width="8" stroke-linecap="round" fill="none"/>
      <line x1="-56" y1="-98" x2="-30" y2="-70" stroke="#ffd45e" stroke-width="5" stroke-linecap="round"/>
      <line x1="56" y1="-98" x2="30" y2="-70" stroke="#ffd45e" stroke-width="5" stroke-linecap="round"/>
      <path d="M-11 2 q11 10 22 0" stroke="#ffd45e" stroke-width="3" fill="none"/>
    </g>
  </defs>

  <rect width="1000" height="640" fill="url(#nc-bg)"/>
  <rect width="1000" height="640" fill="url(#nc-glow)"/>

  <text x="500" y="175" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="104" font-weight="800" fill="#ffffff" letter-spacing="2">Garba Nights</text>
  <text x="500" y="240" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="36" font-weight="600" fill="#ffe08a" letter-spacing="6">NINE NIGHTS · NINE COLOURS</text>

  <!-- nine colour swatches -->
  <g stroke="#ffffff" stroke-width="4">
    <circle cx="130" cy="355" r="30" fill="#ff7a00"/>
    <circle cx="222" cy="355" r="30" fill="#ffffff"/>
    <circle cx="315" cy="355" r="30" fill="#e63946"/>
    <circle cx="407" cy="355" r="30" fill="#1d4ed8"/>
    <circle cx="500" cy="355" r="30" fill="#ffd400"/>
    <circle cx="592" cy="355" r="30" fill="#2e9e4f"/>
    <circle cx="685" cy="355" r="30" fill="#9aa0a8"/>
    <circle cx="777" cy="355" r="30" fill="#7b2ff7"/>
    <circle cx="870" cy="355" r="30" fill="#0f9b8e"/>
  </g>

  <text x="500" y="450" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="34" font-weight="700" fill="#ffffff" opacity="0.95">Jai Mata Di 🌺</text>

  <!-- dancers in the bottom corners -->
  <use href="#dancer2" transform="translate(160,540) scale(1.1)"/>
  <use href="#dancer2" transform="translate(840,540) scale(-1.1,1.1)"/>

  <g fill="#ffe08a">
    <circle cx="110" cy="130" r="5"/>
    <circle cx="900" cy="150" r="6"/>
    <circle cx="845" cy="105" r="4"/>
  </g>
</svg>
