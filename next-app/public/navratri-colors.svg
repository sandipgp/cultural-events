<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-label="Navratri 2026 colours">
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e1145"/>
      <stop offset="0.5" stop-color="#c0143c"/>
      <stop offset="1" stop-color="#f6a01e"/>
    </linearGradient>
    <radialGradient id="nc-glow" cx="50%" cy="26%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- a garba dancer (origin at hip) -->
    <g id="dancer">
      <path d="M-9 -62 L9 -62 L11 0 L-11 0 Z" fill="#fff2e0"/>
      <path d="M-11 0 L-50 86 L50 86 L11 0 Z" fill="#fff2e0"/>
      <circle cx="0" cy="-80" r="15" fill="#fff2e0"/>
      <path d="M-7 -58 L-44 -84" stroke="#fff2e0" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M7 -58 L44 -84" stroke="#fff2e0" stroke-width="8" stroke-linecap="round" fill="none"/>
      <line x1="-56" y1="-98" x2="-30" y2="-70" stroke="#ffd45e" stroke-width="5" stroke-linecap="round"/>
      <line x1="56" y1="-98" x2="30" y2="-70" stroke="#ffd45e" stroke-width="5" stroke-linecap="round"/>
      <path d="M-11 2 q11 10 22 0" stroke="#ffd45e" stroke-width="3" fill="none"/>
    </g>
  </defs>

  <rect width="1000" height="880" fill="url(#nc-bg)"/>
  <rect width="1000" height="880" fill="url(#nc-glow)"/>

  <!-- title -->
  <text x="500" y="250" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="102" font-weight="800" fill="#ffffff" letter-spacing="2">Navratri 2026</text>
  <text x="500" y="320" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="40" font-weight="600" fill="#ffe08a" letter-spacing="6">NINE NIGHTS · NINE COLOURS</text>

  <!-- nine colour swatches -->
  <g stroke="#ffffff" stroke-width="4">
    <circle cx="130" cy="450" r="34" fill="#ff7a00"/>
    <circle cx="222" cy="450" r="34" fill="#ffffff"/>
    <circle cx="315" cy="450" r="34" fill="#e63946"/>
    <circle cx="407" cy="450" r="34" fill="#1d4ed8"/>
    <circle cx="500" cy="450" r="34" fill="#ffd400"/>
    <circle cx="592" cy="450" r="34" fill="#2e9e4f"/>
    <circle cx="685" cy="450" r="34" fill="#9aa0a8"/>
    <circle cx="777" cy="450" r="34" fill="#7b2ff7"/>
    <circle cx="870" cy="450" r="34" fill="#0f9b8e"/>
  </g>

  <text x="500" y="560" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="38" font-weight="700" fill="#ffffff" opacity="0.95">Jai Mata Di 🌺</text>

  <!-- dancers in the bottom corners -->
  <use href="#dancer" transform="translate(165,720) scale(1.5)"/>
  <use href="#dancer" transform="translate(835,720) scale(-1.5,1.5)"/>

  <!-- sparkles -->
  <g fill="#ffe08a">
    <circle cx="110" cy="150" r="5"/>
    <circle cx="900" cy="170" r="6"/>
    <circle cx="840" cy="120" r="4"/>
    <circle cx="500" cy="650" r="4"/>
  </g>
</svg>
