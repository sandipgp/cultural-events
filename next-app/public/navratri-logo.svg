<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Navratri Devi Mata">
  <defs>
    <linearGradient id="nv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0143c"/>
      <stop offset="1" stop-color="#f6a01e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="26" fill="url(#nv-bg)"/>

  <!-- golden halo + rays behind the head -->
  <circle cx="50" cy="48" r="30" fill="#ffd45e" opacity="0.28"/>
  <g stroke="#ffd45e" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="50" y1="10" x2="50" y2="4"/>
    <line x1="24" y1="20" x2="20" y2="15"/>
    <line x1="76" y1="20" x2="80" y2="15"/>
    <line x1="16" y1="44" x2="10" y2="44"/>
    <line x1="84" y1="44" x2="90" y2="44"/>
  </g>

  <!-- hair framing the face -->
  <ellipse cx="33" cy="56" rx="12" ry="19" fill="#6e0a20"/>
  <ellipse cx="67" cy="56" rx="12" ry="19" fill="#6e0a20"/>

  <!-- face -->
  <ellipse cx="50" cy="52" rx="16" ry="19" fill="#fff2e0"/>

  <!-- crown / mukut -->
  <path d="M34 32 L40 16 L46 29 L50 12 L54 29 L60 16 L66 32 Z" fill="#ffd45e" stroke="#e0a920" stroke-width="1"/>
  <circle cx="50" cy="12" r="2.6" fill="#fff2e0"/>
  <circle cx="40" cy="16" r="1.8" fill="#fff2e0"/>
  <circle cx="60" cy="16" r="1.8" fill="#fff2e0"/>

  <!-- third eye + bindi -->
  <path d="M50 39 Q52.5 43 50 47 Q47.5 43 50 39 Z" fill="#c0143c"/>
  <circle cx="50" cy="35" r="2" fill="#c0143c"/>

  <!-- eyes -->
  <ellipse cx="43" cy="50" rx="2.4" ry="1.6" fill="#5a0a1a"/>
  <ellipse cx="57" cy="50" rx="2.4" ry="1.6" fill="#5a0a1a"/>

  <!-- lips -->
  <path d="M45 60 Q50 64 55 60" fill="none" stroke="#c0143c" stroke-width="2" stroke-linecap="round"/>

  <!-- nose ring (nath) -->
  <circle cx="57" cy="57" r="2.4" fill="none" stroke="#ffd45e" stroke-width="1.4"/>
</svg>
