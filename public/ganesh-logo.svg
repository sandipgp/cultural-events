<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ganesha">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e21fae"/>
      <stop offset="1" stop-color="#ff8a1e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="26" fill="url(#g-bg)"/>

  <!-- Ganesha silhouette (white) -->
  <g fill="#ffffff">
    <!-- ears -->
    <ellipse cx="27" cy="42" rx="13" ry="17"/>
    <ellipse cx="73" cy="42" rx="13" ry="17"/>
    <!-- head -->
    <ellipse cx="50" cy="42" rx="19" ry="19"/>
    <!-- crown -->
    <path d="M50 8c6 0 10 6 10 14H40c0-8 4-14 10-14z"/>
  </g>

  <!-- crown jewel -->
  <circle cx="50" cy="7" r="3.4" fill="#ffd45e"/>

  <!-- eyes -->
  <circle cx="42" cy="41" r="2.6" fill="#c026a3"/>
  <circle cx="58" cy="41" r="2.6" fill="#c026a3"/>

  <!-- tilak -->
  <path d="M50 28v8" stroke="#e0a920" stroke-width="2.6" stroke-linecap="round"/>

  <!-- trunk -->
  <path d="M50 47c0 13-3 21-9 24-4 2-7-2-4-6" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M50 47c0 13-3 21-9 24-4 2-7-2-4-6" fill="none" stroke="#e0a920" stroke-width="3" stroke-linecap="round"/>
</svg>
