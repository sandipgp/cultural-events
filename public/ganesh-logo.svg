<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ganesha">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c026a3"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- themed rounded tile -->
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>

  <!-- ears + head + crown (white silhouette) -->
  <g fill="#ffffff">
    <ellipse cx="26" cy="53" rx="13" ry="18"/>
    <ellipse cx="74" cy="53" rx="13" ry="18"/>
    <ellipse cx="50" cy="54" rx="21" ry="22"/>
    <path d="M50 11c5 0 8 5 8 11H42c0-6 3-11 8-11z"/>
  </g>

  <!-- crown jewel -->
  <circle cx="50" cy="11" r="3.2" fill="#ffd45e"/>

  <!-- inner ears -->
  <ellipse cx="26" cy="53" rx="6" ry="9.5" fill="#f7b3e0"/>
  <ellipse cx="74" cy="53" rx="6" ry="9.5" fill="#f7b3e0"/>

  <!-- tilak -->
  <path d="M50 30v9" stroke="#e0a920" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M46 33q4 4 8 0" stroke="#e0a920" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="42" cy="49" r="2.4" fill="#c026a3"/>
  <circle cx="58" cy="49" r="2.4" fill="#c026a3"/>

  <!-- trunk -->
  <path d="M50 45c0 13-1 22-5 27-3 4-9 4-11-1" fill="none" stroke="#e0a920" stroke-width="6" stroke-linecap="round"/>

  <!-- modak (sweet) at trunk tip -->
  <circle cx="33" cy="73" r="4" fill="#ffd45e"/>
</svg>
