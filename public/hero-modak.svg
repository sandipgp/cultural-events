<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Modak">
  <defs>
    <radialGradient id="m-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#fff5df"/>
      <stop offset="1" stop-color="#f7c6e4"/>
    </radialGradient>
    <linearGradient id="m-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.5" stop-color="#f6a81f"/>
      <stop offset="1" stop-color="#b76d09"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#m-bg)"/>

  <!-- ground shadow -->
  <ellipse cx="50" cy="80" rx="21" ry="4" fill="#000000" opacity="0.12"/>

  <!-- modak body: rounded base tapering to a pleated point -->
  <path d="M50 19c10 14 20 23 20 37 0 13-9 22-20 22s-20-9-20-22c0-14 10-23 20-37z"
        fill="url(#m-body)" stroke="#8a5107" stroke-width="1.4"/>

  <!-- pleats -->
  <g stroke="#b9770f" stroke-width="1.7" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M50 24c-6 16-10 27-12 37"/>
    <path d="M50 24c0 18 0 29 0 39"/>
    <path d="M50 24c6 16 10 27 12 37"/>
  </g>

  <!-- highlight + tip -->
  <path d="M43 40c-2 9-2 18 0 26" stroke="#fff3c6" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
  <circle cx="50" cy="20" r="3.2" fill="#ffedb4"/>

  <!-- sparkles -->
  <circle cx="30" cy="33" r="1.7" fill="#ffffff"/>
  <circle cx="70" cy="37" r="1.3" fill="#ffffff"/>
  <circle cx="67" cy="25" r="1" fill="#ffffff"/>
</svg>
